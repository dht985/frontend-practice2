<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <title>社团招新报名</title>
</head>
<body>
  <header>
    <h1>云栖社 · 2026 招新报名</h1>
    <p>计算机爱好者的创意聚集地，来和我们一起搞事情</p>
  </header>
  <nav>
    <a href="#about">关于社团</a>
    <a href="#signup">立即报名</a>
  </nav>
  <main>
    <section id="about">
      <h2>关于社团</h2>
      <p>云栖社成立于 2019 年，是云大信息学院下属的技术型社团。我们承接校内 App 开发、网站搭建、黑客松等项目，也会定期举办技术分享会和编程集训。报名完全免费，所有专业均可参加。</p>
    </section>
    <section id="signup">
      <h2>报名表单</h2>
      <form action="#" method="get" enctype="multipart/form-data">
        <p>
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" placeholder="请输入真实姓名" required>
        </p>
        <p>
          <label for="sid">学号</label>
          <input type="text" id="sid" name="sid" placeholder="例如 20240101001" pattern="\d{11}">
        </p>
        <p>
          <label for="phone">手机号</label>
          <input type="tel" id="phone" name="phone" placeholder="11 位手机号" pattern="^1[3-9]\d{9}$">
        </p>
        <p>
          <label for="mail">邮箱</label>
          <input type="email" id="mail" name="mail" placeholder="校园邮箱即可" required>
        </p>
        <p>
          <label for="college">所属学院</label>
          <select id="college" name="college">
            <option value="">请选择</option>
            <option value="info">信息学院</option>
            <option value="cs">软件学院</option>
            <option value="math">数学与统计学院</option>
            <option value="phy">物理与天文学院</option>
            <option value="other">其他</option>
          </select>
        </p>
        <p>
          <label for="dept">意向部门</label>
          <select id="dept" name="dept" required>
            <option value="">请选择</option>
            <option value="dev">开发部（写代码做项目）</option>
            <option value="design">设计部（UI/UX、平面）</option>
            <option value="media">宣传部（视频、公众号）</option>
            <option value="ops">外联部（活动、赞助）</option>
          </select>
        </p>
        <p>可参与的时间（可多选）</p>
        <p>
          <label><input type="checkbox" name="time" value="weekday"> 周中晚上</label>
          <label><input type="checkbox" name="time" value="weekend"> 周末白天</label>
          <label><input type="checkbox" name="time" value="camp"> 寒暑假集训</label>
        </p>
        <p>是否有编程或设计经验</p>
        <p>
          <label><input type="radio" name="exp" value="yes" checked> 有，能独立完成小项目</label>
          <label><input type="radio" name="exp" value="some"> 学过一些，跟着做过</label>
          <label><input type="radio" name="exp" value="none"> 零基础，但想学</label>
        </p>
        <p>
          <label for="avatar">上传一张照片（可选）</label>
          <input type="file" id="avatar" name="avatar" accept="image/*">
        </p>
        <p>
          <label for="intro">自我介绍</label><br>
          <textarea id="intro" name="intro" rows="4" maxlength="200" placeholder="说说你的兴趣、特长，或者为什么想加入云栖社"></textarea>
        </p>
        <p>
          <button type="submit">提交报名</button>
        </p>
      </form>
    </section>
  </main>
  <footer>
    <p>云栖社 · 软件开发综合实践课程作业</p>
  </footer>
</body>
</html>
